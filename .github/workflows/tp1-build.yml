name: "TP1 – Build Console App"

on:
  push:
    paths: ["PlaylistApp/**", ".github/workflows/tp1-build.yml"]
  pull_request:
    paths: ["PlaylistApp/**"]
  workflow_dispatch:

jobs:
  build:
    name: "🔨 Build TP1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "⚙️ Setup .NET 10"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: "📦 Restore"
        run: dotnet restore PlaylistApp/PlaylistApp.csproj

      - name: "🏗️ Build"
        run: dotnet build PlaylistApp/PlaylistApp.csproj -c Release --no-restore

      - name: "🐳 Docker Build"
        run: docker build -t playlist-tp1 ./PlaylistApp

      - name: "✅ Résumé"
        run: |
          echo "TP1 compilé avec succès !"
          echo "Commande pour tester : docker run -it playlist-tp1"
