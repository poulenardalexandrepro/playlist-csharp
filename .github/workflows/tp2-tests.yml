name: "TP2 – Tests EF Core"

on:
  push:
    paths: ["PlaylistAppEF/**", "PlaylistAppEF.Tests/**", ".github/workflows/tp2-tests.yml"]
  pull_request:
    paths: ["PlaylistAppEF/**", "PlaylistAppEF.Tests/**"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  tests:
    name: "🧪 Tests TP2 (xUnit + SQLite InMemory)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "⚙️ Setup .NET 10"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: "📦 Cache NuGet"
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      - name: "📦 Restore"
        run: |
          dotnet restore PlaylistAppEF/PlaylistAppEF.csproj
          dotnet restore PlaylistAppEF.Tests/PlaylistAppEF.Tests.csproj

      - name: "🏗️ Build"
        run: dotnet build PlaylistAppEF.Tests/PlaylistAppEF.Tests.csproj -c Release --no-restore

      - name: "🧪 Exécuter les tests"
        run: |
          dotnet test PlaylistAppEF.Tests/PlaylistAppEF.Tests.csproj \
            -c Release --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=tp2-results.trx" \
            --logger "console;verbosity=detailed" \
            --collect:"XPlat Code Coverage"

      - name: "📊 Rapport de tests"
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: "Tests TP2 – Entity Framework Core"
          path: "**/*.trx"
          reporter: "dotnet-trx"
          fail-on-error: false

      - name: "📈 Couverture de code"
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: "**/coverage.cobertura.xml"
          flags: tp2
          name: "TP2 Coverage"
          fail_ci_if_error: false

      - name: "🐳 Docker Build TP2"
        run: docker build -t playlist-ef ./PlaylistAppEF

      - name: "📋 Résumé progression"
        if: always()
        run: |
          echo "## Résultats TP2 🧪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build PlaylistAppEF | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests xUnit xUnit | voir rapport ci-dessus |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ✅ |" >> $GITHUB_STEP_SUMMARY
